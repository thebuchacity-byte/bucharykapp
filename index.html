<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Бучарик Mini App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: мобільний застосунок на всю висоту; зверху назва, посередині вміст вкладки, знизу панель вкладок як у Telegram */
:root{
  --bg:#F5F3EF; --surface:#FFFFFF; --fg:#17202B; --muted:#5E6B79; --line:#E3DFD7;
  --accent:#D9481F; --accent-soft:#FBE3DA; --good:#2E7D4F; --warn:#B7791F; --bad:#B3392B;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161D; --surface:#1A232D; --fg:#EEF1F4; --muted:#93A0AE; --line:#2A3541;
  --accent:#F2764A; --accent-soft:#3A2219; --good:#5CBF86; --warn:#E3B04B; --bad:#EE7B6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161D; --surface:#1A232D; --fg:#EEF1F4; --muted:#93A0AE; --line:#2A3541;
  --accent:#F2764A; --accent-soft:#3A2219; --good:#5CBF86; --warn:#E3B04B; --bad:#EE7B6C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.demo{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:4px 8px;border-radius:4px;white-space:nowrap}
main{flex:1;padding:4px 16px 96px;display:flex;flex-direction:column;gap:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--muted);font:500 12px var(--font);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--font);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;background:var(--line);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:500 13px var(--font);padding:7px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.delta{font-family:var(--mono);font-size:13px}
.up{color:var(--good)} .down{color:var(--bad)}
.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
svg.chart text{font:11px var(--mono);fill:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;width:100%}
.row:first-child{border-top:0}
.row b{font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right}
h2{font-size:13px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.day{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.ev time{font-family:var(--mono);font-size:13px;color:var(--accent);min-width:46px;padding-top:1px}
.ev div{min-width:0}
.ev p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tk{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tk p{margin:2px 0 0;color:var(--muted);font-size:13px}
.st{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.st.new{color:var(--muted)} .st.work{color:var(--warn)} .st.done{color:var(--good)}
[hidden]{display:none!important}
</style>
</head><body><div id="app">
  <header>
    <div class="brand">Бучарик<small>Thebuchacity</small></div>
    <span class="demo">тестові дані</span>
  </header>
  <main>
    <section id="v-stats" aria-label="Статистика">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="seg" id="metric">
          <button data-m="followers" aria-pressed="true">Підписники</button>
          <button data-m="reach" aria-pressed="false">Охоплення</button>
        </div>
        <div class="chips" id="nets"></div>
        <div class="panel">
          <div class="lab" id="cap"></div>
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px">
            <div class="big" id="big"></div><div class="delta" id="dl"></div>
          </div>
          <svg class="chart" id="chart" viewBox="0 0 360 190" role="img" aria-label="Графік за 12 місяців"></svg>
        </div>
        <div class="panel"><h2 style="margin-bottom:4px">Усі мережі, жовтень 26</h2><div class="rows" id="all"></div></div>
      </div>
    </section>
    <section id="v-cal" aria-label="Календар" hidden><div id="cal" style="display:flex;flex-direction:column;gap:18px"></div></section>
    <section id="v-tasks" aria-label="Задачі" hidden>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="chips" id="proj"></div>
        <div id="tasks" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </section>
  </main>
  <nav><div class="in" role="tablist">
    <button role="tab" data-v="stats" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Статистика</button>
    <button role="tab" data-v="cal" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календар</button>
    <button role="tab" data-v="tasks" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>Задачі</button>
  </div></nav>
</div>
<script>
(function(){
  var tg=window.Telegram&&window.Telegram.WebApp; if(tg){try{tg.ready();tg.expand();}catch(e){}}
  var $=function(s){return document.querySelector(s)}, $$=function(s){return [].slice.call(document.querySelectorAll(s))};
  var MON=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
  var labels=[]; for(var i=0;i<12;i++){var m=(9+i)%12; labels.push(MON[m]+' '+(m>8?25:26)); }
  /* Тестові дані: вигадані, лише щоб показати вигляд. Справжні числа прийдуть із таблиці статистики. */
  var NETS=[
    {n:'Instagram',f:[21800,22050,22300,22650,22900,23300,23700,24100,24600,25100,25500,25900],r:[410,455,430,520,610,580,700,760,720,840,910,1030]},
    {n:'Facebook',f:[31200,31300,31380,31500,31600,31650,31760,31840,31900,32010,32100,32200],r:[240,251,238,262,280,270,301,296,320,334,341,360]},
    {n:'YouTube',f:[3600,3640,3710,3780,3850,3940,4020,4120,4190,4300,4420,4560],r:[52,48,61,59,70,66,84,90,87,102,118,131]},
    {n:'TikTok',f:[20600,20800,21100,21500,21800,22300,22600,23100,23500,24100,24600,25200],r:[160,210,190,260,330,300,410,380,450,520,610,690]},
    {n:'Telegram',f:[10400,10440,10510,10570,10640,10700,10790,10850,10940,11010,11100,11190],r:null},
    {n:'Threads',f:[1200,1260,1330,1390,1480,1550,1640,1700,1800,1890,1980,2090],r:[18,22,20,27,31,29,38,41,44,52,57,63]},
    {n:'Сайт',f:null,r:[38,41,36,44,52,49,58,61,57,66,72,81]}
  ];
  var fmt=function(v){return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
  var kfmt=function(v){return v>=1000? (v/1000).toFixed(v>=10000?0:1).replace('.',',')+' тис.':fmt(v)};
  var st={m:'followers',net:0,view:'stats',proj:'Усі'};

  function avail(){return NETS.map(function(x,i){return {x:x,i:i}}).filter(function(o){return o.x[st.m==='followers'?'f':'r']})}
  function drawNets(){
    var list=avail(); if(!list.some(function(o){return o.i===st.net})) st.net=list[0].i;
    $('#nets').innerHTML=list.map(function(o){return '<button class="chip" data-i="'+o.i+'" aria-pressed="'+(o.i===st.net)+'">'+o.x.n+'</button>'}).join('');
  }
  function drawChart(){
    var net=NETS[st.net], key=st.m==='followers'?'f':'r', d=net[key];
    var last=d[d.length-1], prev=d[d.length-2], ch=last-prev, pc=ch/prev*100;
    var unit=st.m==='followers'?'підписників':(net.n==='Сайт'?'переглядів сайту за місяць, тис.':'охоплення за місяць, тис.');
    $('#cap').textContent=net.n+' · '+(st.m==='followers'?'підписники':'охоплення');
    $('#big').textContent= st.m==='followers'? fmt(last) : (net.n==='Сайт'? last+' тис.' : last+' тис.');
    $('#dl').className='delta '+(ch>=0?'up':'down');
    $('#dl').textContent=(ch>=0?'+':'−')+(st.m==='followers'?fmt(Math.abs(ch)):Math.abs(ch)+' тис.')+' ('+(ch>=0?'+':'−')+Math.abs(pc).toFixed(1).replace('.',',')+'%) за місяць';
    var W=360,H=190,L=44,R=14,T=14,B=26;
    var mn=Math.min.apply(null,d), mx=Math.max.apply(null,d), pad=(mx-mn)*0.15||mx*0.05;
    var lo=mn-pad, hi=mx+pad;
    var x=function(i){return L+(W-L-R)*i/(d.length-1)}, y=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
    var s='';
    for(var t=0;t<4;t++){var v=lo+(hi-lo)*t/3, yy=y(v);
      s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
      s+='<text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+(st.m==='followers'?kfmt(v).replace(' тис.','k'):Math.round(v))+'</text>';}
    var pts=d.map(function(v,i){return x(i)+','+y(v)}).join(' ');
    s+='<polygon points="'+L+','+(H-B)+' '+pts+' '+(W-R)+','+(H-B)+'" fill="var(--accent)" opacity=".12"/>';
    s+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    s+='<circle cx="'+x(d.length-1)+'" cy="'+y(last)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    for(var i=0;i<d.length;i+=3){s+='<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+labels[i]+'</text>';}
    s+='<text x="'+x(d.length-1)+'" y="'+(H-6)+'" text-anchor="end">'+labels[d.length-1]+'</text>';
    $('#chart').innerHTML=s;
  }
  function drawAll(){
    var key=st.m==='followers'?'f':'r';
    $('#all').innerHTML=avail().map(function(o){var d=o.x[key],l=d[11],p=d[10],c=(l-p)/p*100;
      return '<button class="row" data-i="'+o.i+'"><b>'+o.x.n+'</b><span class="num">'+(st.m==='followers'?fmt(l):l+' тис.')+'<br><span class="delta '+(c>=0?'up':'down')+'">'+(c>=0?'+':'−')+Math.abs(c).toFixed(1).replace('.',',')+'%</span></span></button>'}).join('');
  }
  function stats(){drawNets();drawChart();drawAll();}

  var EV=[
    {d:'Пʼятниця, 9 жовтня',e:[{t:'19:00',n:'Планерка команди',p:'Meet',g:'Усі'}]},
    {d:'Понеділок, 12 жовтня',e:[{t:'11:00',n:'Зйомка з Валентиною',p:'Студія',g:'Подкаст'}]},
    {d:'Середа, 14 жовтня',e:[{t:'14:30',n:'Виїзне інтервʼю, школа №4',p:'Буча',g:'Стаття'},{t:'18:00',n:'Репетиція виступу',p:'Офіс',g:'Заходи'}]},
    {d:'Субота, 17 жовтня',e:[{t:'12:00',n:'Суботні фотки',p:'Чат медіа',g:'Усі'}]},
    {d:'Четвер, 22 жовтня',e:[{t:'10:00',n:'Круглий стіл: дезінформація',p:'Київ',g:'Дезінфо'}]}
  ];
  $('#cal').innerHTML=EV.map(function(day){return '<div class="day"><h2>'+day.d+'</h2>'+day.e.map(function(e){return '<div class="ev"><time>'+e.t+'</time><div><b>'+e.n+'</b><span class="tag">'+e.g+'</span><p>'+e.p+'</p></div></div>'}).join('')+'</div>'}).join('');

  var TK=[
    {n:'Стаття про школу №4',who:'Марія Карпенко',due:'30 жовт.',s:'work',p:'Стаття'},
    {n:'Підготувати сцену й світло',who:'Богдан Макаренко',due:'21 жовт.',s:'new',p:'Заходи'},
    {n:'Монтаж випуску з Валентиною',who:'Богдан Макаренко',due:'16 жовт.',s:'work',p:'Подкаст'},
    {n:'Огляд наративів тижня',who:'Мар’яна Шерстюк',due:'13 жовт.',s:'done',p:'Дезінфо'},
    {n:'Запросити спікерів на захід',who:'Анастасія Авдєєнко',due:'15 жовт.',s:'new',p:'Заходи'},
    {n:'Фактчек цитат у матеріалі',who:'Ольга Присяжна',due:'28 жовт.',s:'new',p:'Стаття'}
  ];
  var SN={new:'Нова',work:'В роботі',done:'Готово'};
  var PR=['Усі','Стаття','Заходи','Подкаст','Дезінфо'];
  function tasks(){
    $('#proj').innerHTML=PR.map(function(p){return '<button class="chip" data-p="'+p+'" aria-pressed="'+(p===st.proj)+'">'+p+'</button>'}).join('');
    $('#tasks').innerHTML=TK.filter(function(t){return st.proj==='Усі'||t.p===st.proj}).map(function(t){
      return '<div class="tk"><div style="min-width:0"><b>'+t.n+'</b><span class="tag">'+t.p+'</span><p>'+t.who+' · до '+t.due+'</p></div><span class="st '+t.s+'">'+SN[t.s]+'</span></div>'}).join('');
  }
  document.addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.v){st.view=b.dataset.v;
      $$('nav button').forEach(function(x){x.setAttribute('aria-selected',x===b)});
      ['stats','cal','tasks'].forEach(function(v){$('#v-'+v).hidden=v!==st.view}); window.scrollTo(0,0);}
    else if(b.dataset.m){st.m=b.dataset.m;$$('#metric button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});stats();}
    else if(b.dataset.i!==undefined){st.net=+b.dataset.i;stats();}
    else if(b.dataset.p){st.proj=b.dataset.p;tasks();}
  });
  stats();tasks();
})();
</script>
</body></html>
