<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Бучарик Mini App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: мобільний застосунок на всю висоту; зверху назва, посередині вміст вкладки, знизу панель вкладок як у Telegram */
:root{
  --bg:#000000; --surface:#0E0E0E; --fg:#FFFFFF; --muted:#A3A3A3; --line:#262626;
  --accent:#FF8A00; --on-accent:#000000; --accent-soft:#2E1C05; --good:#2E7D4F; --warn:#B7791F; --bad:#B3392B;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0E0E0E; --fg:#FFFFFF; --muted:#A3A3A3; --line:#262626;
  --accent:#FF8A00; --on-accent:#000000; --accent-soft:#2E1C05; --good:#5CBF86; --warn:#E3B04B; --bad:#EE7B6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E0E0E; --fg:#FFFFFF; --muted:#A3A3A3; --line:#262626;
  --accent:#FF8A00; --on-accent:#000000; --accent-soft:#2E1C05; --good:#5CBF86; --warn:#E3B04B; --bad:#EE7B6C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.demo{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:4px 8px;border-radius:4px;white-space:nowrap}
main{flex:1;padding:4px 16px 96px;display:flex;flex-direction:column;gap:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font:500 11px var(--font);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--font);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:flex;background:var(--line);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:500 13px var(--font);padding:7px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.delta{font-family:var(--mono);font-size:13px}
.up{color:var(--good)} .down{color:var(--bad)}
.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
svg.chart text{font:11px var(--mono);fill:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;width:100%}
.row:first-child{border-top:0}
.row b{font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right}
h2{font-size:13px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.day{display:flex;flex-direction:column;gap:8px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mh b{font:600 17px var(--font);text-transform:capitalize}
.mh button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;width:40px;height:36px;font-size:18px;cursor:pointer}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mg .wd{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;padding:2px 0}
.mg button{position:relative;aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;font:500 14px var(--font);cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mg button.out{opacity:.35}
.mg button.today{border-color:var(--accent)}
.mg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mg .dots{display:flex;gap:2px;height:6px}
.mg .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.mg button[aria-pressed="true"] .dots i{box-shadow:0 0 0 1px var(--bg)}
.ev{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.ev time{font-family:var(--mono);font-size:13px;color:var(--accent);min-width:46px;padding-top:1px}
.ev div{min-width:0}
.ev p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tk{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tk p{margin:2px 0 0;color:var(--muted);font-size:13px}
.st{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.st.new{color:var(--muted)} .st.work{color:var(--warn)} .st.done{color:var(--good)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.acts span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:500 13px var(--font);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.addbtn{width:100%}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.phead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:12px;cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-weight:600}
.pinfo span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{flex:none;font-family:var(--mono);font-size:13px;min-width:28px;text-align:center;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--fg)}
.cnt.has{background:var(--accent-soft);color:var(--accent)}
.pbody{border-top:1px solid var(--line);padding:4px 12px 12px;display:flex;flex-direction:column}
.pt{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pt:first-child{border-top:0}
.pt p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pt div{min-width:0}
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .box{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.fld input,.fld select{width:100%;min-width:0;font:400 16px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fld input:focus-visible,.fld select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
.fld input[type=date],.fld input[type=time]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;max-width:100%;min-height:44px;text-align:left}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{font-size:14px;color:var(--bad);margin:0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;text-align:center}
.note{color:var(--muted);text-align:center;padding:24px 8px;margin:0}
.st.reported{color:var(--accent)}
[hidden]{display:none!important}

.ck-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;margin:8px 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ck-card span{color:var(--muted);font-size:13px}
.ck-back{background:none;border:0;color:var(--accent);font:inherit;padding:6px 0;cursor:pointer}
.ck-sec{margin:18px 0 6px;font-size:15px}
.ck-item{display:flex;gap:10px;align-items:flex-start;width:100%;margin:4px 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ck-item[aria-checked="true"]{opacity:.65}
.ck-item[aria-checked="true"] span:last-child{text-decoration:line-through}
.ck-box{flex:0 0 22px;height:22px;border:2px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--accent)}
  .hm-date{font-size:24px;font-weight:700;margin:4px 0 6px}
  .hm-hol{font-size:16px;font-weight:700;color:var(--accent);margin:0 0 6px}
  .hm-wx{font-size:20px;font-weight:600;margin:0 0 14px}
  .hm-logo{width:88px;height:88px;min-width:88px;object-fit:contain;border-radius:12px;background:#000;display:block}
  .hm-work{width:100%;margin:0 0 18px;padding:14px;font-size:16px}
  .hm-cd{border:1px solid var(--accent);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--surface)}
  .hm-cd-l{font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
  .hm-cd-n{font-size:26px;font-weight:700;color:var(--accent);margin:4px 0}
  .hm-sat{border-radius:14px;padding:12px;margin-bottom:12px;background:var(--accent-soft);color:var(--accent);font-size:14px;line-height:1.4}
  .hm-quote{display:flex;gap:14px;align-items:center;border:2px solid var(--accent);border-radius:16px;padding:16px;margin-bottom:18px;background:var(--surface)}
  .hm-av,.hm-ph{width:72px;height:72px;min-width:72px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;background:var(--line)}
  .hm-q{font-size:16px;line-height:1.45;font-style:italic}
  .hm-by{font-size:12px;opacity:.7;margin-top:6px}
  .hm-h{font-size:14px;text-transform:uppercase;letter-spacing:.04em;opacity:.7;margin:18px 0 8px}
  .hm-card,.hm-bd{display:flex;gap:12px;align-items:center;border:1px solid rgba(128,128,128,.25);border-radius:14px;padding:12px;margin-bottom:8px}
  .hm-time{font-family:ui-monospace,monospace;min-width:52px;font-weight:600}
  .hm-t{font-weight:600}
  .hm-sub{font-size:13px;opacity:.75;margin-top:2px;line-height:1.35}
</style>
</head><body><div id="app">
  <header>
    <div class="brand">Бучарик<small>Thebuchacity</small></div>
    <span class="demo" id="demo" hidden>тестові дані</span>
  </header>
  <main>
    <section id="v-stats" aria-label="Статистика" hidden><p class="note" id="msg-stats" hidden></p>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="seg" id="metric">
          <button data-m="followers" aria-pressed="true">Підписники</button>
          <button data-m="reach" aria-pressed="false">Охоплення</button>
        </div>
        <div class="chips" id="nets"></div>
        <div class="panel">
          <div class="lab" id="cap"></div>
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px">
            <div class="big" id="big"></div><div class="delta" id="dl"></div>
          </div>
          <svg class="chart" id="chart" viewBox="0 0 360 190" role="img" aria-label="Графік за 12 місяців"></svg>
        </div>
        <div class="panel"><h2 style="margin-bottom:4px">Усі мережі, останній місяць</h2><div class="rows" id="all"></div></div>
      </div>
    </section>
    <section id="v-home" aria-label="Головна"><div id="home-quick"></div><div id="home-box"></div></section>
    <section id="v-cal" aria-label="Календар" hidden><p class="note" id="msg-cal" hidden></p><div style="display:flex;flex-direction:column;gap:14px"><button class="btn pri addbtn" id="add-ev" data-add="event" hidden>＋ Нова подія</button><button class="btn pri addbtn" id="add-tk" data-add="task" hidden>＋ Нова задача</button><button class="btn addbtn" id="add-mt" data-add="meeting" hidden>🎥 Нова онлайн-зустріч</button><div id="cal" style="display:flex;flex-direction:column;gap:18px"></div><div class="chips" id="cproj"></div></div></section>
    <section id="v-team" aria-label="Команда" hidden><p class="note" id="msg-team" hidden></p><p class="hint" style="margin:0 2px 10px">з — відкриті задачі, п — найближчі події, де людина зайнята</p><div id="team" style="display:flex;flex-direction:column;gap:10px"></div></section>
    <section id="v-wk" aria-label="Проєкти" hidden><p class="note" id="msg-wk" hidden></p>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div id="wk" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </section>
    <section id="v-shop" aria-label="ШОП" hidden><div id="shop"></div></section>
    <section id="v-ck" aria-label="Чек-ліст" hidden><div id="ck-box"></div></section>
    <section id="v-exp" aria-label="Витрати" hidden><p class="note" id="msg-exp" hidden></p>
      <div style="display:flex;flex-direction:column;gap:14px">
        <button class="btn pri addbtn" id="add-exp" data-exnew="1">＋ Нова витрата</button>
        <div id="exp" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </section>
  </main>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="box" id="box"></div></div>
  <div class="toast" id="toast" hidden role="status"></div>
  <nav><div class="in" role="tablist">
    <button role="tab" data-v="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg>Головна</button>
    <button role="tab" data-v="cal" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календар</button>
    <button role="tab" data-v="team" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.3c1.8.8 3 2.6 3 4.7"/></svg>Команда</button>
    <button role="tab" id="tab-wk" data-v="wk" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Проєкти</button>
    <button role="tab" data-v="exp" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Витрати</button>
    <button role="tab" id="tab-shop" data-v="shop" aria-selected="false" hidden><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>ШОП</button>
    <button role="tab" data-v="ck" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Чек-ліст</button>
    <button role="tab" id="tab-stats" data-v="stats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Статистика</button>
  </div></nav>
</div>
<script>
(function(){
  /* Адреса API бота на Railway. Порожньо = показувати тестові дані. */
  var API_BASE='https://media-bot-production-ef31.up.railway.app';
  var tg=window.Telegram&&window.Telegram.WebApp; if(tg){try{tg.ready();tg.expand();}catch(e){}}
  var INIT=(tg&&tg.initData)||'';
  var LIVE=!!(API_BASE&&INIT);
  var $=function(s){return document.querySelector(s)}, $$=function(s){return [].slice.call(document.querySelectorAll(s))};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var WD=['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];
  var MG=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  var MON=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
  var fmt=function(v){return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
  var dec=function(x){return x.toFixed(1).replace('.',',').replace(',0','')};
  var big=function(v){var a=Math.abs(v);return a>=1e6?dec(v/1e6)+' млн':a>=1e4?Math.round(v/1e3)+' тис.':a>=1e3?dec(v/1e3)+' тис.':fmt(v)};
  var axis=function(v){var a=Math.abs(v);return a>=1e6?dec(v/1e6)+'M':a>=1e4?Math.round(v/1e3)+'k':a>=1e3?dec(v/1e3)+'k':Math.round(v)};
  var st={open:'',m:'followers',net:0,view:'cal',cm:null,csel:'',proj:'Усі',cproj:'Усі',confirm:'',busy:''};
  var D={labels:[],nets:[],events:[],tasks:[],team:[],me:{stats:true,tasks:true}};

  function demo(){
    var L=[],now=new Date();
    for(var i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);L.push(MON[d.getMonth()]+' '+String(d.getFullYear()).slice(2));}
    var k=1000;
    D.labels=L;
    D.nets=[
      {n:'Instagram',f:[21800,22050,22300,22650,22900,23300,23700,24100,24600,25100,25500,25900],r:[410,455,430,520,610,580,700,760,720,840,910,1030].map(function(x){return x*k})},
      {n:'Facebook',f:[31200,31300,31380,31500,31600,31650,31760,31840,31900,32010,32100,32200],r:[240,251,238,262,280,270,301,296,320,334,341,360].map(function(x){return x*k})},
      {n:'YouTube',f:[3600,3640,3710,3780,3850,3940,4020,4120,4190,4300,4420,4560],r:[52,48,61,59,70,66,84,90,87,102,118,131].map(function(x){return x*k})},

  function attachMaterials(body){

    var files=fe?Array.prototype.slice.call(fe.files||[]):[];
    if(!links.length&&!files.length) return Promise.resolve();
    if(files.length>10) return Promise.reject(new Error('Можна додати до 10 файлів.'));
    var bad=files.filter(function(f){return f.size>10*1024*1024})[0];

      box.innerHTML='<h2>Чек-ліст</h2><p class="note">Оберіть тип роботи. Галочки зберігаються у вас і не зникають після закриття застосунку.</p>'+
        CK.lists.map(function(x){var n=0;x.sections.forEach(function(s){n+=s.items.length});
          return '<button class="ck-card" data-ckopen="'+esc(x.key)+'"><b>'+esc(x.name)+'</b><span>'+esc(x.short)+' · '+n+' пунктів</span></button>'}).join('');
      return;
    }
    var set={},total=0,dn=0;L.done.forEach(function(i){set[i]=1});
    var html='<button class="ck-back" data-ckback="1">← Усі чек-листи</button><h2>'+esc(L.name)+'</h2>';
    L.sections.forEach(function(s){
      html+='<h3 class="ck-sec">'+esc(s.title)+'</h3>';
      s.items.forEach(function(it){
        total++; var on=!!set[it.id]; if(on) dn++;
        html+='<button class="ck-item" role="checkbox" aria-checked="'+on+'" data-ckkey="'+esc(L.key)+'" data-ckid="'+esc(it.id)+'"><span class="ck-box">'+(on?'✓':'')+'</span><span>'+esc(it.text)+'</span></button>';
      });
    });
    html+='<p class="note">Виконано '+dn+' з '+total+'</p><div class="acts"><button class="btn" data-ckreset="'+esc(L.key)+'">Скинути чек-лист</button></div>';
    box.innerHTML=html;
  }
  function ckToggle(key,id,on){
    var L=CK.lists.filter(function(x){return x.key===key})[0]; if(!L) return;
    L.done=on?L.done.concat([id]).filter(function(v,i,a){return a.indexOf(v)===i}):L.done.filter(function(v){return v!==id});
    ckRender();
    if(!LIVE) return;
    ckApi('/api/checklist/toggle',{key:key,item:id,done:on}).then(function(r){if(!r.ok){toast(r.note||'Не вдалося зберегти');ckLoad()}})
      .catch(function(){toast("Немає зв'язку. Спробуйте ще раз.");ckLoad()});
  }
  function ckReset(key){
    var L=CK.lists.filter(function(x){return x.key===key})[0]; if(!L) return;
    L.done=[]; ckRender();
    if(LIVE) ckApi('/api/checklist/reset',{key:key}).catch(function(){toast('Не вдалося скинути. Спробуйте ще раз.');ckLoad()});
  }
  var HOME_DEMO={date:'2026-10-13',quote:'Кожен текст, який ви сьогодні напишете, хтось прочитає. Пишіть так, ніби від цього залежить чийсь день.',events:[{id:'d1',project:'Подкаст',title:'Вихід подкасту, епізод 4',time:'19:30',place:''}],birthdays:[]};
  function imgInto(el,url){
    if(!el||!LIVE) return;
    fetch(url,{headers:{'X-Init-Data':INIT}}).then(function(r){if(!r.ok) throw 0;return r.blob()}).then(function(b){
      el.src=URL.createObjectURL(b);el.hidden=false;
      var fb=el.nextElementSibling; if(fb&&fb.classList.contains('hm-fb')) fb.hidden=true;
    }).catch(function(){});
  }
  function homeRender(h){
    var d=new Date((h.date||'')+'T12:00:00'),box=$('#home-box');
    var dateTxt=isNaN(d)?'':WD[d.getDay()]+', '+d.getDate()+' '+MG[d.getMonth()]+' '+d.getFullYear();
    var html='<div class="hm-date">'+esc(dateTxt)+'</div>';
    if(h.weather) html+='<div class="hm-wx">'+esc(h.weather.icon)+' '+esc(h.weather.city)+', '+h.weather.temp+'°C · '+esc(h.weather.text)+'</div>';
    if(h.birthdays&&h.birthdays.length){
      html+='<h3 class="hm-h">День народження</h3>';
      html+=h.birthdays.map(function(b,i){return '<div class="hm-bd"><img class="hm-ph" id="hm-bd'+i+'" alt="" hidden><span class="hm-ph hm-fb">🎂</span><div><div class="hm-t">'+esc(b.name)+'</div><div class="hm-sub">'+esc(b.greeting)+'</div></div></div>'}).join('');
    }
    html+='<button class="btn pri addbtn hm-work" data-wknew="1">＋ '+esc(h.work_label||'Що я зробив?')+'</button>';
    if(h.next_event){var ne=h.next_event,left=ne.days>0?ne.days+' дн. '+ne.hours+' год':(ne.hours>0?ne.hours+' год '+ne.minutes+' хв':ne.minutes+' хв');
      html+='<div class="hm-cd"><div class="hm-cd-l">До найближчої події</div><div class="hm-cd-n">'+left+'</div><div class="hm-sub">'+esc(ne.title)+' · '+esc(ne.project)+' · '+esc(ne.date)+', '+esc(ne.time)+'</div></div>';}
    if(h.saturday) html+='<div class="hm-sat">📸 Сьогодні субота — «Суботні фотки»! Кидайте в чат свої кадри з тижня.</div>';
    html+='<h3 class="hm-h">Сьогодні заплановано</h3>';
    html+=(h.events&&h.events.length)?h.events.map(function(e){return '<div class="hm-card"><div class="hm-time">'+esc(e.time)+'</div><div><div class="hm-t">'+esc(e.title)+'</div><div class="hm-sub">'+esc(e.project)+(e.place?' · '+esc(e.place):'')+'</div></div></div>'}).join(''):'<p class="note">На сьогодні подій немає.</p>';
    box.innerHTML=html;
    if(h.birthdays) h.birthdays.forEach(function(b,i){
      var el=$('#hm-bd'+i), sp=sitePhoto(b.name);
      if(sp){el.src=sp;el.hidden=false;var fb=el.nextElementSibling;if(fb&&fb.classList.contains('hm-fb')) fb.hidden=true;}
      else imgInto(el,API_BASE+'/api/photo/'+b.uid);
    });
  }

  function show(v){
    st.view=v;
    $$('nav button').forEach(function(x){x.setAttribute('aria-selected',x.dataset.v===v)});
    ['home','stats','cal','team','exp','wk','ck','shop'].forEach(function(n){$('#v-'+n).hidden=n!==v});
    if(v==='ck') ckShow();
    window.scrollTo(0,0);
  }
  document.addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.v) show(b.dataset.v);
    else if(b.dataset.ckopen!==undefined){CK.open=b.dataset.ckopen;ckRender();window.scrollTo(0,0)}
    else if(b.dataset.ckback!==undefined){CK.open='';ckRender();window.scrollTo(0,0)}
    else if(b.dataset.ckkey){ckToggle(b.dataset.ckkey,b.dataset.ckid,b.getAttribute('aria-checked')!=='true')}
    else if(b.dataset.ckreset){ckReset(b.dataset.ckreset)}
    else if(b.dataset.m){st.m=b.dataset.m;$$('#metric button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});stats();}
    else if(b.dataset.i!==undefined){st.net=+b.dataset.i;stats();}
    else if(b.dataset.p){st.proj=b.dataset.p;tasks();}
    else if(b.dataset.cp){st.cproj=b.dataset.cp;cal();}
    else if(b.dataset.cm){var mm=st.cm.m+ +b.dataset.cm,yy=st.cm.y;if(mm<0){mm=11;yy--}else if(mm>11){mm=0;yy++}st.cm={y:yy,m:mm};st.csel='';cal();}
    else if(b.dataset.cd){st.csel=st.csel===b.dataset.cd?'':b.dataset.cd;cal();}
    else if(b.dataset.act){act(b.dataset.act,b.dataset.id);}
    else if(b.dataset.tm){st.open=st.open===b.dataset.tm?'':b.dataset.tm;team();}
    else if(b.dataset.add){openAdd(b.dataset.add);}
    else if(b.dataset.ap!==undefined){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');}
    else if(b.dataset.all){var k=b.dataset.all,on=b.getAttribute('aria-pressed')!=='true';
      document.querySelectorAll('#f-'+k+' .chip').forEach(function(c){c.setAttribute('aria-pressed',on)});}
    else if(b.dataset.who||b.dataset.pp){var k2=b.dataset.who?'who':'pp',on2=b.getAttribute('aria-pressed')!=='true';
      b.setAttribute('aria-pressed',on2);
      var all=document.querySelector('#f-'+k2+' [data-all]');
      if(all){var rest=document.querySelectorAll('#f-'+k2+' .chip:not([data-all])');
        all.setAttribute('aria-pressed',Array.prototype.every.call(rest,function(c){return c.getAttribute('aria-pressed')==='true'}))}}
    else if(b.dataset.fp!==undefined){var a1=b.dataset.fp.split('|');FS[a1[0]].p=a1[1];if(a1[0]==='wk')works();else exps();}
    else if(b.dataset.fq){var a2=b.dataset.fq.split('|');FS[a2[0]].m=a2[1]==='all'?'':a2[1];if(a2[0]==='wk')works();else exps();}
    else if(b.dataset.wknew){wkForm();}
    else if(b.dataset.wp!==undefined||b.dataset.wt!==undefined){var g=b.parentNode;g.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b)});}
    else if(b.dataset.wksave){var pp=document.querySelector('#f-wp [aria-pressed="true"]'),tt2=document.querySelector('#f-wt [aria-pressed="true"]'),fe3=$('#f-err');
      if(!pp||!tt2){fe3.textContent='Оберіть проєкт і що саме зроблено.';fe3.hidden=false;return}
      b.disabled=true;wkPost('/api/work',{project:pp.dataset.wp,type:tt2.dataset.wt,title:$('#f-title').value.trim(),date:$('#f-date').value});}
    else if(b.dataset.wkdel){if(b.dataset.confirm==='1'){wkPost('/api/work/delete',{id:b.dataset.wkdel})}else{b.dataset.confirm='1';b.textContent='Точно? Ще раз';}}
    else if(b.dataset.exnew){expForm();}
    else if(b.dataset.exsave){var tt=$('#f-title').value.trim(),am=$('#f-amt').value.trim();var fe2=$('#f-err');
      if(!tt||!am){fe2.textContent='Заповніть назву й суму.';fe2.hidden=false;return}
      b.disabled=true;expPost('/api/expense',{title:tt,amount:am,kind:EXPK==='inc'?'надходження':''});}
    else if(b.dataset.ek){EXPK=b.dataset.ek;exps();}
    else if(b.dataset.quick){if(b.dataset.quick==='sale'){show('shop')}else if(b.dataset.quick==='income'){EXPK='inc';expForm()}else{adQuick()}}
    else if(b.dataset.sell){shopForm(b.dataset.sell);}
    else if(b.dataset.shsize){var gz=b.parentNode;gz.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b&&c.getAttribute('aria-pressed')!=='true'))})}
    else if(b.dataset.shch){var gh=b.parentNode;gh.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b&&c.getAttribute('aria-pressed')!=='true'))})}
    else if(b.dataset.shloc){var gl=b.parentNode;gl.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b&&c.getAttribute('aria-pressed')!=='true'))})}
    else if(b.dataset.stock){stockForm()}
    else if(b.dataset.stocksave){stockSave(b)}
    else if(b.dataset.shcolor){var gc=b.parentNode;gc.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b&&c.getAttribute('aria-pressed')!=='true'))})}
    else if(b.dataset.shdisc){var bx=document.getElementById('f-disc-box');var on=bx.hidden;bx.hidden=!on;b.setAttribute('aria-pressed',String(on));if(!on){document.getElementById('f-disc').value='';}shopTotal();}
    else if(b.dataset.shdq){document.getElementById('f-disc').value=b.dataset.shdq;shopTotal();}
    else if(b.dataset.shsave){shopSave(b.dataset.shsave);}
    else if(b.dataset.expaid){expPost('/api/expense/act',{id:b.dataset.expaid,action:'paid',paid:b.dataset.v2==='1'});}
    else if(b.dataset.expdel){if(b.dataset.confirm==='1'){expPost('/api/expense/act',{id:b.dataset.expdel,action:'delete'})}else{b.dataset.confirm='1';b.textContent='Точно? Ще раз';}}
    else if(b.dataset.evedit){editForm(b.dataset.evedit);}
    else if(b.dataset.evsave){var pl=$('#f-place');changeEvent({id:b.dataset.evsave,action:'edit',title:$('#f-title').value.trim(),date:$('#f-date').value,time:$('#f-time').value,place:pl?pl.value.trim():undefined});}
    else if(b.dataset.evdel){if(b.dataset.confirm==='1'){changeEvent({id:b.dataset.evdel,action:'cancel'})}else{b.dataset.confirm='1';b.textContent='Точно скасувати? Натисни ще раз';}}
    else if(b.dataset.sub){if(b.dataset.sub==='cancel')closeSheet();else submit(b.dataset.sub);}
  });

  document.addEventListener('change',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.fsel){FS[t.dataset.fsel].m=t.value;if(t.dataset.fsel==='wk')works();else exps();}});
  $('#sheet').addEventListener('click',function(e){if(e.target===$('#sheet'))closeSheet()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
  function boot(){
    if(!LIVE){demo();homeRender(HOME_DEMO);$('#add-ev').hidden=false;$('#add-mt').hidden=false;$('#add-tk').hidden=false;D.wk={viewer:true,projects:['Стаття','Подкаст'],types:['Інтерв\'ю','Стаття','Репортаж','Вертикальне відео','Відео на YouTube'],items:[{id:'w1',date:'2026-10-11',uid:3,name:'Ольга Присяжна',project:'Стаття',type:'Репортаж',title:'Форум у Бучі'},{id:'w2',date:'2026-10-09',uid:3,name:'Ольга Присяжна',project:'Стаття',type:'Інтерв\'ю',title:''},{id:'w3',date:'2026-10-10',uid:2,name:'Марія Карпенко',project:'Стаття',type:'Відео на YouTube',title:'Як живе місто'}]};D.exp={owner:true,items:[{id:'x1',date:'2026-10-10 12:00',uid:2,name:'Марія Карпенко',title:'Оренда студії',amount:1500,paid:false},{id:'x2',date:'2026-10-09 15:00',uid:2,name:'Марія Карпенко',title:'Таксі на зйомку',amount:240,paid:true},{id:'x3',date:'2026-10-11 10:00',uid:1,name:'Богдан Макаренко',title:'Карта пам’яті',amount:890,paid:false}]};stats();cal();tasks();team();exps();works();return}
    say('cal','Завантажую…');
    api('/api/me').then(function(me){
      D.me=me;$('#add-ev').hidden=!me.can_event;$('#add-mt').hidden=!me.can_meeting;$('#add-tk').hidden=!me.can_task;
      if(!me.stats){$('#tab-stats').hidden=true}
      var jobs=[api('/api/events').then(function(r){D.events=r.events;cal()})];
      jobs.push(api('/api/works').then(function(r){D.wk=r;works();if(!r.viewer){$('#tab-wk').hidden=true}}));
      $('#home-box').innerHTML='<p class="note">Завантажую головну…</p>';
      api('/api/home').then(function(r){homeRender(r)}).catch(function(){
        $('#home-box').innerHTML='<p class="note">Головна не завантажилась. Закрийте застосунок і відкрийте знову.</p>';
      });
      jobs.push(api('/api/expenses').then(function(r){D.exp=r;exps()}));
      jobs.push(api('/api/shop').then(function(r){D.shop=r;shopRender()}).catch(function(){$('#tab-shop').hidden=true}));
      jobs.push(api('/api/team').then(function(r){D.team=r.members;team()}));
      if(me.stats) jobs.push(api('/api/stats?months=12').then(function(r){D.labels=r.labels;D.nets=r.nets;stats()}));
      return Promise.all(jobs);
    }).catch(function(e){
      var t=e&&e.code===403?'Цей застосунок лише для команди Thebuchacity. Попросіть додати ваш Telegram ID у таблицю.':'Не вдалося завантажити дані. Закрийте застосунок і відкрийте знову.';
      ['stats','cal','team','exp','wk'].forEach(function(n){say(n,t)});
    });
  }
  boot();
})();
</script>
