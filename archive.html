<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Архів статей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Той самий стиль, що й Бучарик: чорний фон, помаранчевий акцент, Rubik */
:root{
  --bg:#000000; --surface:#0E0E0E; --fg:#FFFFFF; --muted:#A3A3A3; --line:#262626;
  --accent:#FF8A00; --on-accent:#000000; --accent-soft:#2E1C05; --bad:#EE7B6C;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4}
#app{max-width:560px;margin:0 auto;padding:14px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.back{flex:none;font:500 13px var(--font);color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px;text-decoration:none}
form{display:grid;gap:8px;margin-bottom:12px}
input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);width:100%;min-height:48px}
input::placeholder{color:var(--muted)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:600 16px var(--font);padding:14px 10px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line);font:500 14px var(--font)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{color:var(--muted);font-size:13px;margin:4px 2px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.card img{display:block;width:100%;height:auto;max-height:260px;object-fit:cover;background:var(--line)}
.body{padding:14px}
.title{font-weight:600;font-size:16px;margin:0 0 6px}
.date{color:var(--muted);font-size:12px;font-family:var(--font);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px}
.row a,.row button{flex:1;text-align:center;text-decoration:none;font-size:14px;padding:11px 10px;border-radius:10px}
.row a{background:var(--accent);color:var(--on-accent);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:32px 0}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">Архів статей<small>Thebuchacity</small></div>
  <a class="back" href="index.html">← Бучарик</a>
</header>
<form id="f">
  <input id="q" type="search" placeholder="Пошук за словами, наприклад: вулиця енергетиків" autocomplete="off">
  <div class="dates">
    <input id="df" type="date" aria-label="Від дати">
    <input id="dt" type="date" aria-label="До дати">
  </div>
  <button type="submit">Знайти</button>
</form>
<div class="meta" id="meta"></div>
<div id="list"></div>
</div>
<script>
(function () {
  var API_BASE = 'https://media-bot-production-ef31.up.railway.app';
  var tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  var INIT = (tg && tg.initData) || '';
  var list = document.getElementById('list');
  var meta = document.getElementById('meta');

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(d) {
    if (!d) return '';
    var p = d.slice(0, 10).split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : d;
  }
  function openLink(url) {
    if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
  }
  function copyText(text, btn) {
    function done() {
      btn.textContent = 'Скопійовано ✓';
      setTimeout(function () { btn.textContent = 'Копіювати посилання'; }, 1500);
    }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = text;
      document.body.appendChild(t);
      t.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      t.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }
  function render(items) {
    list.innerHTML = '';
    if (!items.length) {
      list.innerHTML = '<div class="empty">Нічого не знайдено. Спробуйте інші слова або дати.</div>';
      return;
    }
    items.forEach(function (a) {
      var c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = (a.image ? '<img loading="lazy" src="' + esc(a.image) + '" alt="">' : '') +
        '<div class="body"><p class="title">' + esc(a.title) + '</p>' +
        '<div class="date">' + esc(fmt(a.date)) + '</div>' +
        '<div class="row"><a href="' + esc(a.link) + '" target="_blank" rel="noopener">Відкрити статтю</a>' +
        '<button class="ghost" type="button">Копіювати посилання</button></div></div>';
      c.querySelector('a').addEventListener('click', function (e) { e.preventDefault(); openLink(a.link); });
      c.querySelector('button').addEventListener('click', function (e) { copyText(a.link, e.currentTarget); });
      list.appendChild(c);
    });
  }
  function load() {
    var p = new URLSearchParams();
    var q = document.getElementById('q').value.trim();
    var f = document.getElementById('df').value;
    var t = document.getElementById('dt').value;
    if (q) p.set('q', q);
    if (f) p.set('from', f);
    if (t) p.set('to', t);
    meta.textContent = 'Шукаю…';
    fetch(API_BASE + '/api/articles?' + p.toString(), { headers: { 'X-Init-Data': INIT } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        meta.textContent = 'Знайдено статей: ' + d.count + (q ? ' за запитом «' + q + '»' : '') + '. Нові зверху.';
        render(d.articles);
      })
      .catch(function (e) {
        meta.textContent = 'Не вдалося завантажити (' + e.message + '). Відкрийте з бота командою /articles.';
      });
  }
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); load(); });
  load();
})();
</script>
</body>
</html>
